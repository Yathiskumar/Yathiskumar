name: Generate profile graphics

on:
  schedule:
    # Every day at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # Pac-Man runs first: it is a Node action and must create dist/ as the
      # runner user. Platane/snk is a Docker action running as root — if it
      # creates dist/ first, the Pac-Man step hits EACCES writing into it.
      - name: Generate Pac-Man animation
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman

      # Stats cards are generated here rather than hot-linked from the public
      # *.vercel.app instance, which shares one GitHub token across all users
      # and intermittently serves an "ERROR!!! Cards are temporarily rate
      # limited" SVG. Generating them with our own token removes that failure
      # mode, and the Action (unlike the hosted API) covers every repo.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 5.5
          THEME: github_dark
          AUTO_PUSH: false

      - name: Collect summary cards into dist/
        run: |
          cp profile-summary-card-output/github_dark/*.svg dist/
          ls -la dist/

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Normalise permissions on generated files
        run: sudo chown -R "$(id -u):$(id -g)" dist && ls -la dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
